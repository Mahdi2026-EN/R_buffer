spring.application.name=backend

# ===============================
# PostgreSQL Database
# ===============================
# The database password is NOT stored here.
# Put it in secrets.properties (git-ignored) or set the
# environment variable SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/backend_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===============================
# JWT Configuration
# ===============================
# app.jwt.secret is NOT stored here (see secrets.properties
# or the environment variable APP_JWT_SECRET). Use at least 32 characters.
app.jwt.expiration=86400000

# ===============================
# CORS (comma-separated list of front-end addresses)
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# ===============================
# First administrator (created automatically if no admin exists yet)
# Set app.admin.email / app.admin.password in secrets.properties
# ===============================
app.admin.full-name=Site Administrator

# ===============================
# Local, private settings (git-ignored file)
# ===============================
spring.config.import=optional:classpath:secrets.properties

# ===============================
# Logging
# ===============================
logging.level.org.springframework.security=INFO
logging.level.com.example.backend=INFO
